<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickets — Plugboard</title>
  <link rel="icon" href="/dashboard/favicon.svg">
  <script src="/dashboard/theme.js?v=2"></script>
  <link rel="stylesheet" href="/dashboard/style.css?v=14">
  <link rel="stylesheet" href="/dashboard/suivi.css?v=2">
</head>
<body class="suivi">
  <header class="suivi-head">
    <a class="suivi-back" href="/dashboard">← Dashboard</a>
    <h1>Ticket board</h1>
    <button id="suivi-import" class="suivi-btn" type="button">Import</button>
  </header>

  <p id="suivi-msg" class="suivi-msg" role="status" aria-live="polite"></p>

  <form id="suivi-new" class="suivi-new" data-testid="suivi-new">
    <label class="suivi-new-label" for="new-titre">New ticket</label>
    <input id="new-titre" name="titre" type="text" required maxlength="200" placeholder="Ticket title">
    <select id="new-priorite" name="priorite" aria-label="Priority">
      <option>P0</option><option>P1</option><option selected>P2</option><option>P3</option>
    </select>
    <select id="new-type" name="type" aria-label="Type">
      <option value="fonction" selected>Feature</option>
      <option value="bug">Bug</option>
      <option value="dette">Debt</option>
      <option value="securite">Security</option>
    </select>
    <button class="suivi-btn" type="submit">Create</button>
  </form>

  <main id="suivi-board" class="suivi-board" data-testid="suivi-board" aria-busy="true"></main>

  <script src="/dashboard/suivi.js?v=2"></script>
</body>
</html>
