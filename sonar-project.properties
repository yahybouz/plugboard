sonar.issue.ignore.multicriteria=decorativeRandom
sonar.issue.ignore.multicriteria.decorativeRandom.ruleKey=javascript:S2245
sonar.issue.ignore.multicriteria.decorativeRandom.resourceKey=static/live3d.js
