# Plugboard — SonarQube analysis.
#
#   make sonar-up     start a local SonarQube server (docker, port 9000)
#   make sonar-scan   run the scanner against it (needs coverage.xml: make test)
#   make sonar-down   stop the server (the analysis volumes are kept)
#
# In CI the `sonarqube` job reads SONAR_HOST_URL and SONAR_TOKEN; projectVersion
# is passed on the command line from the VERSION file, so it is not set here.

sonar.projectKey=plugboard
sonar.projectName=Plugboard
sonar.sourceEncoding=UTF-8

sonar.sources=plugboard,static,deploy,scripts,run.py
sonar.tests=tests

# Vendored third-party code, generated files and runtime data are not ours to
# analyse.
sonar.exclusions=**/__pycache__/**,static/vendor/**,**/*.min.js,data/**,docs/**,**/*.lock,**/registry.example.json
# Tests, operator scripts, deployment files and the dashboard are analysed, but
# they do not carry the Python coverage target.
sonar.coverage.exclusions=tests/**,scripts/**,static/**,deploy/**,run.py
sonar.cpd.exclusions=tests/**

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=report.xml

sonar.scm.provider=git

# Math.random only scatters decorative points in the 3D monitoring view.
sonar.issue.ignore.multicriteria=decorativeRandom
sonar.issue.ignore.multicriteria.decorativeRandom.ruleKey=javascript:S2245
sonar.issue.ignore.multicriteria.decorativeRandom.resourceKey=static/live3d.js
