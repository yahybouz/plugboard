sonar.projectKey=plugboard
sonar.projectName=Plugboard
sonar.sourceEncoding=UTF-8
sonar.sources=plugboard,static,deploy,scripts,run.py
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,static/vendor/**,**/*.min.js
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=static/**,deploy/**,scripts/**,run.py
