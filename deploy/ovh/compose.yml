# Private single-instance deployment. Run from the repository root:
# docker compose -f deploy/ovh/compose.yml --env-file /etc/plugboard/runtime.env up -d --build
name: plugboard-private
services:
  gateway:
    build:
      context: ../..
      target: full
    # The default names this release (VERSION; tests/test_ci_image_full.py
    # keeps them equal), so a plain `up -d` never starts an older image.
    # PLUGBOARD_IMAGE picks another tag, such as the previous image kept for
    # a rollback (docs/runbooks/rollback-release.md).
    image: ${PLUGBOARD_IMAGE:-plugboard:private-full-v4.15.0}
    restart: unless-stopped
    env_file:
      - ${PLUGBOARD_ENV_FILE:-/etc/plugboard/runtime.env}
    environment:
      HOST: "0.0.0.0"
      PORT: "8765"
      PLUGBOARD_DATA: /app/data
      PLUGBOARD_LOCAL_AUTO_LOGIN: "0"
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ""
      # Tailscale Serve reaches the gateway through the gateway of the
      # default network below, whose subnet is fixed: trust that address
      # only, so the rate limit and the login lockout count each tailnet
      # client (D-50). Tailscale Serve sets X-Forwarded-For itself.
      FORWARDED_ALLOW_IPS: "172.30.115.1"
      # Eight chats at once; a ninth waits up to 10 s for a slot (D-32).
      # Ollama, at a private address, still takes one chat at a time
      # (PLUGBOARD_LOCAL_PROVIDER_MAX_INFLIGHT, default 1) until it is
      # measured: a second chat for it waits up to 10 s for its turn.
      PLUGBOARD_MAX_INFLIGHT_CHAT: "8"
      PLUGBOARD_INFLIGHT_WAIT_S: "10"
      PLUGBOARD_PROVIDER_WAIT_S: "10"
      # Each CLI provider runs one chat at a time; the next ones wait in its
      # queue, within the same 10 s, then get 503 providers_busy (D-43).
      PLUGBOARD_CLI_PROVIDER_MAX_INFLIGHT: "1"
      PLUGBOARD_SUBPROCESS_LIMIT: "1"
      PLUGBOARD_CODEX_SANDBOX: read-only
      # Model catalog and pricing jobs run on their default cadence (see
      # README, Model and pricing jobs). No inference probes: the agy account
      # list (`agy models`) is synced without spending subscription quota, and
      # the other providers' saved catalogs are retained as they are.
      MODEL_AVAILABILITY_SCHEDULER_DISABLED: "0"
      PLUGBOARD_MODEL_REFRESH_PROBE_KINDS: ""
      PLUGBOARD_INTERNET_CHECK_ON_BOOT: "0"
      PRICING_SCHEDULER_DISABLED: "0"
      PLUGBOARD_LLM_PRICING: "0"
      # Ollama is off by default (decision YB 14/11): no bridge network, no
      # URL, no embedding model. To bring it back: OLLAMA_ENABLED "true",
      # OLLAMA_URL, PLUGBOARD_EMBEDDING_MODELS and the ollama-private network
      # (see README, Ollama bridge).
      OLLAMA_ENABLED: "false"
      # Publish installed references only, not an unverified paid cloud catalog.
      PLUGBOARD_OLLAMA_CLOUD_AUTOSYNC: "0"
      # Small VM: only Ollama Cloud models (:cloud, manifest-only) can be
      # pulled; local pulls must leave 5 GB free (admin can override).
      PLUGBOARD_LOCAL_MODEL_DOWNLOADS: "0"
      PLUGBOARD_OLLAMA_MIN_FREE_GB: "5"
    networks:
      - default
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - data:/app/data
      # CLI logins (.codex, .claude, .gemini) live only in this volume: log in
      # from inside the container. Never bind the host account's CLI homes,
      # which native host sessions would load (see README, CLI homes).
      - cli-home:/home/app
      - logs:/app/logs
    security_opt:
      - no-new-privileges:true
      # Bubblewrap needs user/mount namespaces, not a privileged container.
      # Install the named AppArmor policy with install-codex-sandbox.sh first.
      - apparmor=plugboard-codex
      - seccomp=${PLUGBOARD_CODEX_SECCOMP_PROFILE:-/opt/plugboard/deploy/ovh/codex-seccomp.json}
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 3g
    cpus: 1.75
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  # Fixed, so its gateway (FORWARDED_ALLOW_IPS above) never changes when
  # the network is recreated (D-50). Never overlapping plugboard-ollama
  # (172.30.114.0/29, install-ollama-bridge.sh), if Ollama is turned back on.
  default:
    ipam:
      config:
        - subnet: 172.30.115.0/29
          gateway: 172.30.115.1
volumes:
  data:
  cli-home:
  logs:
