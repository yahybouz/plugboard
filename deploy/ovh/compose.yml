# Private single-instance deployment. Run from the repository root:
# docker compose -f deploy/ovh/compose.yml --env-file /etc/plugboard/runtime.env up -d --build
name: plugboard-private
services:
  gateway:
    build:
      context: ../..
      target: full
      args:
        GEMINI_CLI_VERSION: "0.65.0"
        CLAUDE_CODE_VERSION: "2.1.306"
        CODEX_VERSION: "0.163.0"
    image: plugboard:private-full-v4.3.1
    restart: unless-stopped
    env_file:
      - ${PLUGBOARD_ENV_FILE:-/etc/plugboard/runtime.env}
    environment:
      HOST: "0.0.0.0"
      PORT: "8765"
      PLUGBOARD_DATA: /app/data
      PLUGBOARD_LOCAL_AUTO_LOGIN: "0"
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ""
      PLUGBOARD_MAX_INFLIGHT_CHAT: "1"
      PLUGBOARD_SUBPROCESS_LIMIT: "1"
      PLUGBOARD_CODEX_SANDBOX: read-only
      MODEL_AVAILABILITY_SCHEDULER_DISABLED: "1"
      PLUGBOARD_INTERNET_CHECK_ON_BOOT: "0"
      PRICING_SCHEDULER_DISABLED: "1"
      PLUGBOARD_LLM_PRICING: "0"
      OLLAMA_ENABLED: "true"
      OLLAMA_URL: http://172.30.114.1:11434
      # Publish installed references only, not an unverified paid cloud catalog.
      PLUGBOARD_OLLAMA_CLOUD_AUTOSYNC: "0"
    networks:
      - default
      - ollama-private
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - data:/app/data
      # CLI logins (.codex, .claude, .gemini) live only in this volume: log in
      # from inside the container. Never bind the host account's CLI homes,
      # which native host sessions would load (see README, CLI homes).
      - cli-home:/home/app
      - logs:/app/logs
    security_opt:
      - no-new-privileges:true
      # Bubblewrap needs user/mount namespaces, not a privileged container.
      # Install the named AppArmor policy with install-codex-sandbox.sh first.
      - apparmor=plugboard-codex
      - seccomp=${PLUGBOARD_CODEX_SECCOMP_PROFILE:-/opt/plugboard/deploy/ovh/codex-seccomp.json}
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 3g
    cpus: 1.75
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  ollama-private:
    external: true
    name: plugboard-ollama
volumes:
  data:
  cli-home:
  logs:
