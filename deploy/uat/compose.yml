# UAT Plugboard — déployé par /usr/local/sbin/uat-deployer (image dans compose.env).
# docker compose -p uat-plugboard --env-file /srv/plugboard/compose.env -f /srv/plugboard/compose.yml up -d
name: uat-plugboard
services:
  gateway:
    image: ${PLUGBOARD_IMAGE:?PLUGBOARD_IMAGE (compose.env)}
    pull_policy: never
    restart: unless-stopped
    env_file:
      - ./secrets/runtime.env
    environment:
      HOST: "0.0.0.0"
      PORT: "8765"
      # Caddy (host) reaches the app through the bridge gateway: trust its
      # X-Forwarded-For so rate limit / login lockout are per client.
      FORWARDED_ALLOW_IPS: "172.18.0.1"
      PLUGBOARD_DATA: /app/data
      PLUGBOARD_LOCAL_AUTO_LOGIN: "0"
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ""
      PLUGBOARD_MAX_INFLIGHT_CHAT: "8"
      PLUGBOARD_INFLIGHT_WAIT_S: "10"
      PLUGBOARD_PROVIDER_WAIT_S: "10"
      PLUGBOARD_CLI_PROVIDER_MAX_INFLIGHT: "1"
      PLUGBOARD_SUBPROCESS_LIMIT: "1"
      # Model catalogue and price jobs run on their default cadence, as in
      # prod, so the Jobs page shows a last run for each (INC-2). No inference
      # probes: they spend subscription quota on every run (the agy account
      # list is synced without one). To probe Claude's models by hand, set
      # PLUGBOARD_MODEL_REFRESH_PROBE_KINDS=claude for that run only.
      MODEL_AVAILABILITY_SCHEDULER_DISABLED: "0"
      PRICING_SCHEDULER_DISABLED: "0"
      PLUGBOARD_MODEL_REFRESH_PROBE_KINDS: ""
      PLUGBOARD_INTERNET_CHECK_ON_BOOT: "0"
      PLUGBOARD_LLM_PRICING: "0"
      # Ollama is off by default (decision YB 14/11): no relay, no embedding
      # model. To bring it back, set OLLAMA_ENABLED "true", OLLAMA_URL and
      # PLUGBOARD_EMBEDDING_MODELS (see deploy/uat/README.md).
      OLLAMA_ENABLED: "false"
      PLUGBOARD_OLLAMA_CLOUD_AUTOSYNC: "0"
      PLUGBOARD_LOCAL_MODEL_DOWNLOADS: "0"
    ports:
      - "127.0.0.1:18765:8765"
    volumes:
      - data:/app/data
      # CLI logins (.claude, .codex, .gemini, agy) live only in this volume
      - cli-home:/home/app
      - logs:/app/logs
    security_opt:
      - no-new-privileges:true
      # BUG-43 : sandbox bwrap de codex (userns + mount) ; seccomp = defaut Docker + userns/mount,
      # AppArmor = docker-default + mount (/etc/apparmor.d/plugboard-userns). cap_drop ALL conserve.
      - seccomp=/srv/plugboard/seccomp/plugboard-userns.json
      - apparmor=plugboard-userns
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 3g
    cpus: 1.75
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  data:
  cli-home:
  logs:
