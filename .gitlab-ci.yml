# Plugboard — GitLab CI (canonical pipeline).
# The GitHub mirror runs the same checks in .github/workflows/ci.yml.
#
#   lint      ruff check and format check, registry example JSON
#   test      pytest + coverage, against a throwaway data directory
#   analysis  SonarQube scan (only when SONAR_HOST_URL and SONAR_TOKEN are set)
#   security  gitleaks over the pushed commits, bandit, pip-audit
#   build     docker build of the slim `api` target (not pushed)
#   smoke     nightly model smoke test (scheduled pipelines only)

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid duplicate branch + merge request pipelines.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - lint
  - test
  - analysis
  - security
  - build
  - smoke

variables:
  PYTHON_IMAGE: "python:3.12-slim"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # Coverage floor (measured: 84% on 2026-10-17).
  COV_MIN: "80"

# Scheduled pipelines run the smoke job only.
.not-scheduled:
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

.python:
  extends: .not-scheduled
  image: $PYTHON_IMAGE
  cache:
    key:
      files:
        - requirements-dev.lock
    paths:
      - .cache/pip
  before_script:
    - python -m pip install --require-hashes -r requirements-dev.lock

# ── lint ──────────────────────────────────────────────────────

ruff:
  extends: .python
  stage: lint
  script:
    - ruff check plugboard/ tests/
    - python -m json.tool plugboard/registry.example.json > /dev/null

ruff-format:
  extends: .python
  stage: lint
  script:
    - ruff format --check plugboard/ tests/

# ── test ──────────────────────────────────────────────────────

pytest:
  extends: .python
  stage: test
  variables:
    # Never read a .env file, never touch a real data directory.
    PLUGBOARD_SKIP_DOTENV: "1"
  script:
    - export PLUGBOARD_DATA="$(mktemp -d)"
    - >-
      python -m pytest tests/ -q -p no:cacheprovider
      --cov=plugboard --cov-report=term --cov-report=xml:coverage.xml
      --cov-fail-under="$COV_MIN" --junitxml=report.xml
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - coverage.xml
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# ── analysis ──────────────────────────────────────────────────
# Reads pytest's coverage.xml, so it never runs the suite itself. Set the
# masked CI/CD variables SONAR_HOST_URL (https://..., no trailing /) and
# SONAR_TOKEN to enable it; without them the job is simply not created.

sonarqube:
  extends: .not-scheduled
  stage: analysis
  image:
    name: sonarsource/sonar-scanner-cli:11.5
    entrypoint: [""]
  needs:
    - job: pytest
      artifacts: true
  variables:
    # Full history, so SonarQube can attribute new code to its commits.
    GIT_DEPTH: "0"
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.cache/sonar"
  cache:
    key: "sonar-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/sonar
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $SONAR_HOST_URL && $SONAR_TOKEN
  script:
    - sonar-scanner -Dsonar.projectVersion="$(cat VERSION)"

# ── security ──────────────────────────────────────────────────

gitleaks:
  extends: .not-scheduled
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: [""]
  needs: []
  variables:
    GIT_DEPTH: "0"
  script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # Scan only the commits this pipeline brings: the merge request diff, the
    # pushed range, or the whole history for a new branch or a tag.
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        LOG_OPTS="$CI_MERGE_REQUEST_DIFF_BASE_SHA..$CI_COMMIT_SHA"
      elif [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        LOG_OPTS="$CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA"
      else
        LOG_OPTS="$CI_COMMIT_SHA"
      fi
      echo "gitleaks range: $LOG_OPTS"
      gitleaks git --config .gitleaks.toml --redact --no-banner --verbose --log-opts="$LOG_OPTS" .

bandit:
  extends: .python
  stage: security
  needs: []
  script:
    - bandit -r plugboard/ -x tests/ -ll

pip-audit:
  extends: .python
  stage: security
  needs: []
  script:
    - pip-audit --strict --progress-spinner off --disable-pip --require-hashes -r requirements-dev.lock

# ── build ─────────────────────────────────────────────────────

docker-build:
  extends: .not-scheduled
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build --target api -t "plugboard:ci-$CI_COMMIT_SHORT_SHA" .
    # The image must run as the non-root user and declare a health check.
    - |
      user="$(docker image inspect "plugboard:ci-$CI_COMMIT_SHORT_SHA" --format '{{.Config.User}}')"
      test "$user" = "app"
      docker image inspect "plugboard:ci-$CI_COMMIT_SHORT_SHA" --format '{{json .Config.Healthcheck.Test}}' | grep health

# ── smoke (scheduled) ─────────────────────────────────────────
# Pings every model of a deployed instance once and fails when more than
# 20% of them do not answer (max_tokens=64 per call, a few cents per run).
# Create a pipeline schedule and set the masked CI/CD variables
# PLUGBOARD_URL (https://..., no trailing /) and PLUGBOARD_API_KEY.

smoke-models:
  extends: .python
  stage: smoke
  needs: []
  timeout: 15 minutes
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $PLUGBOARD_URL && $PLUGBOARD_API_KEY
  variables:
    PLUGBOARD_SKIP_DOTENV: "1"
  before_script:
    - python -m pip install --require-hashes -r requirements.lock
  script:
    - export API_KEY="$PLUGBOARD_API_KEY" ADMIN_KEY="$PLUGBOARD_API_KEY"
    - export PLUGBOARD_DATA="$(mktemp -d)"
    # The script exits 1 as soon as one model fails; the 20% tolerance below
    # decides. A crash leaves no JSON and fails the next step.
    - python scripts/smoke_models.py --json --timeout 30 > smoke-report.json || true
    - cat smoke-report.json
    - |
      python - <<'PY'
      import json
      import sys

      with open("smoke-report.json", encoding="utf-8") as fh:
          report = json.load(fh)

      total = report.get("total", 0)
      fail = report.get("fail", 0)
      if total == 0:
          print("smoke-models returned 0 models: instance unreachable?")
          sys.exit(2)

      ratio = fail / total
      print(f"smoke summary: {report['ok']}/{total} ok, {fail} fail ({ratio:.1%})")
      for row in report.get("results", []):
          if row.get("status") != "ok":
              print(f"WARNING model {row.get('model')} failed: {row.get('error', 'unknown error')}")
      if ratio > 0.2:
          print(f"failure rate {ratio:.1%} exceeds the 20% tolerance")
          sys.exit(1)
      PY
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - smoke-report.json
