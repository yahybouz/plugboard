[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plugboard-sdk"
version = "0.1.0"
description = "Official Python SDK for Plugboard, the self-hosted LLM gateway for every provider"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Plugboard contributors" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
# httpx is only needed for the async client. Keep it optional so
# sync-only users stay on stdlib.
async = ["httpx>=0.27"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]

[tool.hatch.build.targets.wheel]
packages = ["plugboard_sdk"]
